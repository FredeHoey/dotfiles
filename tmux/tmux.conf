# default statusbar colors
set-option -g status-style "fg=#{{ colors.base04 }},bg=#{{ colors.base01 }}"

# default window title colors
set-window-option -g window-status-style "fg=#{{ colors.base04 }},bg=#{{ colors.base01 }}"

# active window title colors
set-window-option -g window-status-current-style "fg=#{{ colors.base0A }},bg=#{{ colors.base01 }}"

# pane border
set-option -g pane-border-style "fg=#{{ colors.base01 }}"
set-option -g pane-active-border-style "fg=#{{ colors.base04 }}"

# message text
set-option -g message-style "fg=#{{ colors.base06 }},bg=#{{ colors.base02 }}"

# pane number display
set-option -g display-panes-active-colour "#{{ colors.base04 }}"
set-option -g display-panes-colour "#{{ colors.base01 }}"

# clock
set-window-option -g clock-mode-colour "#{{ colors.base0D }}"

# copy mode highlight
set-window-option -g mode-style "fg=#{{ colors.base04 }},bg=#{{ colors.base02 }}"

# bell
set-window-option -g window-status-bell-style "fg=#{{ colors.base00 }},bg=#{{ colors.base08 }}"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#{{ colors.base05 }},bg=#{{ colors.base01 }}"

# style for command messages
set-option -g message-command-style "fg=#{{ colors.base06 }},bg=#{{ colors.base02 }}"

set-window-option -g window-active-style "fg=#{{ colors.base05 }},bg=#{{ colors.base00 }}"
set-window-option -g window-style "fg=#{{ colors.base05 }},bg=#{{ colors.base01 }}"

set-option -g status "on"
set-option -g status-justify "left"
set-option -g status-left "#[fg=#{{ colors.base05 }},bg=#{{ colors.base03 }}] #S #[fg=#{{ colors.base03 }},bg=#{{ colors.base01 }},nobold,noitalics,nounderscore]"
set-option -g status-left-length "80"
set-option -g status-left-style none
set-option -g status-right "#[fg=#{{ colors.base02 }},bg=#{{ colors.base01 }} nobold, nounderscore, noitalics]#[fg=#{{ colors.base04 }},bg=#{{ colors.base02 }}] %Y-%m-%d  %H:%M #[fg=#{{ colors.base05 }},bg=#{{ colors.base02 }},nobold,noitalics,nounderscore]#[fg=#{{ colors.base01 }},bg=#{{ colors.base05 }}] #h "
set-option -g status-right-length "80"
set-option -g status-right-style none
set-window-option -g window-status-current-format "#[fg=#{{ colors.base01 }},bg=#{{ colors.base0A }},nobold,noitalics,nounderscore]#[fg=#{{ colors.base02 }},bg=#{{ colors.base0A }}] #I #[fg=#{{ colors.base02 }},bg=#{{ colors.base0A }},bold] #W#{?window_zoomed_flag,*Z,} #[fg=#{{ colors.base0A }},bg=#{{ colors.base01 }},nobold,noitalics,nounderscore]"
set-window-option -g window-status-format "#[fg=#{{ colors.base01 }},bg=#{{ colors.base02 }},noitalics]#[fg=#{{ colors.base06 }},bg=#{{ colors.base02 }}] #I #[fg=#{{ colors.base06 }},bg=#{{ colors.base02 }}] #W#{?window_zoomed_flag,*Z,} #[fg=#{{ colors.base02 }},bg=#{{ colors.base01 }},noitalics]"
set-window-option -g window-status-separator ""

set -g set-clipboard on
set -sg escape-time 0
set -g mouse on
set -g focus-events on
set -g history-limit 20000
set -g status-position bottom
set -g status-left-length 100
set -g default-terminal 'tmux-256color'
set -sa terminal-features ',foot:RGB'
set -sa terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -sa terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION SSH_CLIENT SSH_TTY DISPLAY"
set-hook -g client-attached 'run-shell {{ dotfile_dir }}/scripts/tmux-ssh-agent'
set-environment -g COLORTERM "truecolor"
set -wg mode-keys vi

bind-key -n M-a if-shell "tmux select-window -t :0" "" "new-window -t :0"
bind-key -n M-s if-shell "tmux select-window -t :1" "" "new-window -t :1"
bind-key -n M-d if-shell "tmux select-window -t :2" "" "new-window -t :2"
bind-key -n M-f if-shell "tmux select-window -t :3" "" "new-window -t :3"

bind-key -n M-A if-shell "tmux move-pane -t :0" "" "break-pane -t :0"
bind-key -n M-S if-shell "tmux move-pane -t :1" "" "break-pane -t :1"
bind-key -n M-D if-shell "tmux move-pane -t :2" "" "break-pane -t :2"
bind-key -n M-F if-shell "tmux move-pane -t :3" "" "break-pane -t :3"

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind-key b copy-mode\; send-keys -X start-of-line\; send-keys -X search-backward "🐧"

bind-key -T copy-mode-vi "C-h" select-pane -L
bind-key -T copy-mode-vi "C-j" select-pane -D
bind-key -T copy-mode-vi "C-k" select-pane -U
bind-key -T copy-mode-vi "C-l" select-pane -R

bind-key C-p run-shell {{ dotfile_dir }}/scripts/tmux-project
bind-key C-l run-shell {{ dotfile_dir }}/scripts/git-fzf-log.sh

bind-key j split-pane -h -c "#{pane_current_path}"
bind-key k split-pane -v -c "#{pane_current_path}"

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
