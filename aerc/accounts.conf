{% for user in users %}
[{{user.name}}]
copy-to = [Gmail]/Sent Mail
from = {{ user.real_name }} <{{ user.email }}>
outgoing = smtp+plain://{{ user.email }}@{{ user.smtp_server.host }}:{{ user.smtp_server.port }}
outgoing-cred-cmd = {{ user.email_password_cmd }}
pgp-auto-sign = false
pgp-key-id = {{ user.gpg_key }}
pgp-opportunistic-encrypt = false
postpone = [Gmail]/Drafts
source = maildir://~/.mail/{{ user.name }}/
archive = Archive

{% endfor %}
