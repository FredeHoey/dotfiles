[{{user.name}}]
copy-to = [Gmail]/Sent Mail
from = {{ user.real_name }} <{{ user.email }}>
outgoing = smtp+plain://{{ user.email }}@{{ smtp_server.host }}:{{ smtp_server.port }}
outgoing-cred-cmd = rbw get gmail-app-password
pgp-auto-sign = false
pgp-key-id = {{ user.gpg_key }}
pgp-opportunistic-encrypt = false
postpone = [Gmail]/Drafts
source = imaps://{{ user.email }}@{{ imap_server.host }}:{{ imap_server.port }}
source-cred-cmd = rbw get gmail-app-password
